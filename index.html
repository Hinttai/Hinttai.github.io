<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Кейс Баттл</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1d;
        color: #ffffff;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        background: #2c2c30;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid #444;
      }
      h1 {
        color: #ff4757;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      p {
        color: #bdc3c7;
        font-size: 1.1em;
      }
      .status {
        margin-top: 20px;
        font-size: 0.9em;
        color: #2ed573;
        font-weight: bold;
      }
    </style>
  </head>
<body>
    <div class="container">
      <h1>Капля Человечности</h1>
      <p>Твой сайт на GitHub Pages.</p>
      <p>Домен: Hinttai.github.io</p>
      <div class="status">Статус: Активен</div>
    </div>
  </body>
</html>
